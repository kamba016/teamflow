services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: teamflow_db
      POSTGRES_USER: teamflow_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamflow_user -d teamflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./backend:/app

    environment:
      POSTGRES_DB: teamflow_db
      POSTGRES_USER: teamflow_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    depends_on:
      db:
        condition: service_healthy

    command: python manage.py runserver 0.0.0.0:8000

volumes:
  postgres_data: